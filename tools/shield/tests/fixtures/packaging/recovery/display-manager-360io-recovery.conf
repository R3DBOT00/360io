# Installed as display-manager.service.d/360io-recovery.conf. Keeps the
# display manager (and therefore the 360io shell session it would start)
# down when recovery was requested for this boot. Both conditions are
# negated and ANDed: the DM starts only when neither signal is present.
[Unit]
Wants=360io-recovery-detect.service
After=360io-recovery-detect.service
ConditionPathExists=!/run/360io/recovery-requested
ConditionKernelCommandLine=!360io.recovery=1
